name: Build for MacOs (on Intel)

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  build_mac_intel:
    runs-on: macos-15-intel

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4.1.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5.0.0
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install py2app
        brew install create-dmg
        
    - name: Build Exec
      run: |
        pyside6-uic ./pkg/ui/main.ui -o ./pkg/ui/main_ui.py
        pyside6-uic ./pkg/ui/nm.ui   -o ./pkg/ui/nm_ui.py
        pyside6-lupdate ./pkg/ui/main.ui ./pkg/ui/nm.ui ./pkg/ui/about_ui.py ./pkg/ui/debug_ui.py ./pkg/ui/login_ui.py ./pkg/nm_window.py ./pkg/main_window.py ./pkg/ierWorker.py ./pkg/versionWorker.py ./pkg/api/devices.py ./pkg/api/device_flam.py ./pkg/api/device_lunii.py -ts ./locales/fr_FR.ts
        pyside6-lrelease ./locales/fr_FR.ts ./locales/fr_FR.qm  
        pyside6-rcc ./resources.qrc -o ./resources_rc.py
        python macos_setup.py py2app
        ls -al ./dist/
        echo "SIZE POST-BUILD"
        du -sh ./dist/luniiQt*
    
    # - name: Make portable archive
    #   run: |
    #     cd dist
    #     ditto -c -k --sequesterRsrc --keepParent luniiQt.app luniiQt-${{ github.ref_name }}.zip

    # - name: Upload Portable Artefact
    #   uses: actions/upload-artifact@v4.0.0
    #   with:
    #     name: luniiQt-${{ github.ref_name }}-MacOs-x86_64_Py2App
    #     compression-level: 0 # no compression
    #     path: |
    #       ./dist/luniiQt-${{ github.ref_name }}.zip

    - name: Cleanup MacOs App
      run: |
        echo "SIZE PRE-CLEANUP"
        du -sh ./dist/luniiQt*
        python macos_cleanup.py
        echo "SIZE POST-CLEANUP"
        du -sh ./dist/luniiQt*

    # Two fixes that must run after the cleanup and before packaging:
    #
    # 1. py2app's launcher stub is a universal binary (x86_64 + arm64), but the
    #    native extension modules pip installs on this runner are x86_64-only.
    #    On an Apple Silicon Mac, LaunchServices picks the stub's arm64 slice and
    #    the stub then aborts inside __boot__.py with "incompatible architecture"
    #    before the main script ever runs, showing only py2app's generic
    #    "Launch error" dialog. Thinning the stub leaves no wrong slice to pick,
    #    so this build runs consistently under Rosetta.
    #
    # 2. macos_cleanup.py deletes files that py2app had already sealed into the
    #    code signature, so the shipped bundle failed `codesign --verify` with
    #    "a sealed resource is missing or invalid". An invalid signature cannot
    #    be bypassed with "Open Anyway", so the bundle has to be re-signed once
    #    it is final.
    - name: Force native architecture and re-sign bundle
      run: |
        set -e
        ARCH=x86_64
        APP=./dist/luniiQt.app
        for exe in lunii-qt python; do
          p="$APP/Contents/MacOS/$exe"
          [ -e "$p" ] || continue
          echo "$exe: $(lipo -archs "$p")"
          if [ "$(lipo -archs "$p")" != "$ARCH" ]; then
            lipo -thin "$ARCH" "$p" -output "$p.$ARCH"
            mv "$p.$ARCH" "$p"
            echo "$exe thinned to $(lipo -archs "$p")"
          fi
        done
        codesign --force --deep --sign - "$APP"
        codesign --verify --verbose=1 "$APP"

    # - name: Make Light portable archive
    #   run: |  
    #     cd dist
    #     ditto -c -k --sequesterRsrc --keepParent luniiQt.app luniiQt-${{ github.ref_name }}.zip

    # - name: Upload Portable Artefact
    #   uses: actions/upload-artifact@v4.0.0
    #   with:
    #     name: luniiQt-${{ github.ref_name }}-MacOs-x86_64_Py2App_Light
    #     compression-level: 0 # no compression
    #     path: |
    #       ./dist/luniiQt-${{ github.ref_name }}.zip

    - name: Create DMG
      run: |
        # create a polished DMG:
        # - custom background with arrow graphic
        # - volume icon (.icns)
        # - fixed window position/size and icon sizes
        # - app icon placed on the left, Applications link on the right
        create-dmg \
          --volname "luniiQt-${{ github.ref_name }} Installer" \
          --volicon "res/dmg_icon.icns" \
          --background "res/dmg_background.png" \
          --window-pos 200 120 \
          --window-size 600 425 \
          --icon-size 70 \
          --icon "luniiQt.app" 185 185 \
          --app-drop-link 415 185 \
          --format UDZO \
          "dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.dmg" \
          "dist/luniiQt.app"
        
    - name: Upload DMG Artefact
      uses: actions/upload-artifact@v4.0.0
      with:
        name: luniiQt-${{ github.ref_name }}-MacOs-x86_64_DMG
        compression-level: 0 # no compression
        path: |
          ./dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.dmg

# create a component package that will install the .app into /Applications
    - name: Create PKG installer
      run: |
        pkgbuild --component "./dist/luniiQt.app" --install-location "/Applications" "./dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.pkg"
        echo "PKG SIZE"
        du -sh ./dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.pkg

    - name: Upload PKG Artefact
      uses: actions/upload-artifact@v4.0.0
      with:
        name: luniiQt-${{ github.ref_name }}-MacOs-x86_64_PKG
        compression-level: 0 # no compression
        path: |
          ./dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.pkg

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        draft: true
        files: |
          ./dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.dmg
          ./dist/luniiQt-${{ github.ref_name }}-MacOs-x86_64.pkg
